<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />

		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<link
			rel="preload"
			href="/fonts/Americana-Regular.otf"
			as="font"
			type="font/otf"
			crossorigin
		/>

		<link rel="icon" type="image/png" href="/favicon.png?v=20" />
		<link rel="icon" href="/favicon.ico?v=20" sizes="any" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=20" />
		<meta name="theme-color" content="#050914" />

		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
